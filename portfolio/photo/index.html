<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SA VISUAL — Photo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
  :root{
    --bg:#070708;--fg:#f0f0f1;--silver:#c7c7d0;--dim:#5f5f66;--dimmer:#3a3a40;
    --line:rgba(240,240,241,0.12);--glass:rgba(22,22,26,0.6);
    --serif:'Bodoni Moda',serif;--mono:'JetBrains Mono',monospace;--body:'Pretendard',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--fg);font-family:var(--body);height:100vh;overflow:hidden;cursor:none;position:relative;}
  ::selection{background:var(--fg);color:var(--bg);}
  .grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:radial-gradient(rgba(240,240,241,0.05) 1px,transparent 1px);background-size:34px 34px;
    mask-image:radial-gradient(ellipse 80% 70% at 50% 50%,#000 30%,transparent 100%);
    -webkit-mask-image:radial-gradient(ellipse 80% 70% at 50% 50%,#000 30%,transparent 100%);}

  .cur-dot,.cur-ring{position:fixed;top:0;left:0;border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);}
  .cur-dot{width:4px;height:4px;background:var(--fg);}
  .cur-ring{width:34px;height:34px;border:1px solid rgba(240,240,241,0.35);transition:width .3s,height .3s,background .3s,border-color .3s;}
  .cur-ring.hov{width:60px;height:60px;background:rgba(240,240,241,0.06);border-color:transparent;}
  @media(hover:none){.cur-dot,.cur-ring{display:none;}body{cursor:auto;}}

  .topbar{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:30px 44px;font-family:var(--mono);font-size:12px;letter-spacing:1.5px;}
  .brand{display:flex;align-items:center;gap:11px;}
  .brand a{color:var(--fg);text-decoration:none;display:flex;align-items:center;gap:11px;}
  .brand .sq{width:9px;height:9px;background:var(--fg);}
  .brand .ver{color:var(--dim);}
  .nav a{color:var(--dim);text-decoration:none;transition:color .3s;}
  .nav a:hover{color:var(--fg);}

  /* category title */
  .cat-head{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:5;text-align:center;pointer-events:none;}
  .cat-head h1{font-family:var(--serif);font-weight:500;font-size:clamp(70px,16vw,240px);line-height:.9;letter-spacing:-0.02em;
    color:transparent;-webkit-text-stroke:1px rgba(240,240,241,0.07);}

  /* 3D carousel */
  .scene{position:fixed;inset:0;z-index:10;perspective:1700px;}
  .carousel{position:absolute;top:46%;left:50%;transform-style:preserve-3d;}
  .item{position:absolute;top:0;left:0;width:195px;height:255px;margin:-128px 0 0 -98px;
    cursor:pointer;backface-visibility:hidden;}
  .item-inner{width:100%;height:100%;border-radius:10px;overflow:hidden;position:relative;
    background:#141418;border:1px solid rgba(240,240,241,0.08);
    box-shadow:0 30px 60px rgba(0,0,0,0.5);transition:border-color .4s;}
  .item:hover .item-inner{border-color:rgba(240,240,241,0.4);}
  .item img{width:100%;height:100%;object-fit:cover;filter:grayscale(.4) brightness(.8);transition:filter .5s;}
  .item:hover img{filter:grayscale(0) brightness(1);}
  .item .ov{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;
    background:linear-gradient(transparent 45%,rgba(7,7,8,0.92));}
  .item .ov .t{font-family:var(--body);font-weight:500;font-size:12px;line-height:1.32;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .item .ov .y{font-family:var(--mono);font-size:9.5px;letter-spacing:.5px;color:var(--silver);margin-top:4px;}

  /* arrows */
  .arrow-btn{position:fixed;top:50%;transform:translateY(-50%);z-index:40;width:58px;height:58px;border-radius:50%;
    border:1px solid var(--line);background:rgba(12,12,14,0.6);backdrop-filter:blur(8px);
    display:flex;align-items:center;justify-content:center;cursor:none;transition:background .3s,border-color .3s;}
  .arrow-btn:hover{background:var(--fg);border-color:var(--fg);}
  .arrow-btn svg{width:18px;height:18px;stroke:var(--fg);fill:none;stroke-width:1.5;transition:stroke .3s;}
  .arrow-btn:hover svg{stroke:var(--bg);}
  .arrow-btn.left{left:40px;}.arrow-btn.right{right:40px;}

  /* counter */
  .counter{position:fixed;bottom:34px;left:50%;transform:translateX(-50%);z-index:40;
    font-family:var(--mono);font-size:12px;letter-spacing:2px;color:var(--dim);}
  .counter b{color:var(--fg);font-weight:500;}
  .hint{position:fixed;bottom:34px;right:44px;z-index:40;font-family:var(--mono);font-size:11px;letter-spacing:1.5px;color:var(--dimmer);}

  /* ===== Detail overlay ===== */
  .overlay{position:fixed;inset:0;z-index:200;background:rgba(7,7,8,0.86);backdrop-filter:blur(18px);
    display:none;opacity:0;transition:opacity .5s ease;overflow-y:auto;}
  .overlay.open{display:block;}
  .overlay.show{opacity:1;}
  .ov-wrap{max-width:1180px;margin:0 auto;padding:120px 44px 80px;}
  .ov-close{position:fixed;top:30px;right:44px;z-index:210;width:48px;height:48px;border-radius:50%;
    border:1px solid var(--line);background:rgba(12,12,14,0.6);display:flex;align-items:center;justify-content:center;cursor:none;transition:background .3s;}
  .ov-close:hover{background:var(--fg);}
  .ov-close svg{width:18px;height:18px;stroke:var(--fg);stroke-width:1.6;transition:stroke .3s;}
  .ov-close:hover svg{stroke:var(--bg);}
  .ov-head{margin-bottom:34px;}
  .ov-head h2{font-family:var(--serif);font-weight:500;font-size:clamp(30px,4vw,56px);line-height:1.05;letter-spacing:-0.01em;margin-bottom:16px;}
  .ov-meta{display:flex;gap:24px;font-family:var(--mono);font-size:11px;letter-spacing:1.5px;color:var(--dim);text-transform:uppercase;flex-wrap:wrap;}
  .ov-media{width:100%;border-radius:10px;overflow:hidden;background:#000;margin-bottom:50px;}
  .ov-video{position:relative;padding-bottom:56.25%;height:0;}
  .ov-video iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
  .ov-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;}
  .ov-gallery img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px;}
  .ov-credits{border-top:1px solid var(--line);padding-top:40px;}
  .ov-credits h3{font-family:var(--mono);font-size:12px;letter-spacing:3px;color:var(--dim);text-transform:uppercase;margin-bottom:26px;}
  .credits-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 60px;max-width:760px;}
  .credit{display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid rgba(240,240,241,0.06);padding-bottom:12px;}
  .credit .role{font-family:var(--mono);font-size:11px;letter-spacing:1px;color:var(--dim);text-transform:uppercase;}
  .credit .who{font-family:var(--body);font-size:14px;color:var(--fg);text-align:right;}

  @media(max-width:768px){
    .topbar{padding:22px;}.cur-dot,.cur-ring{display:none;}
    .item{width:150px;height:200px;margin:-100px 0 0 -75px;}
    .arrow-btn{width:46px;height:46px;}.arrow-btn.left{left:14px;}.arrow-btn.right{right:14px;}
    .ov-wrap{padding:90px 22px 60px;}.credits-grid{grid-template-columns:1fr;}
    .hint{display:none;}
  }
</style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="cur-dot"></div>
  <div class="cur-ring"></div>

  <div class="topbar">
    <div class="brand"><a href="/portfolio/"><span class="sq"></span> SA VISUAL <span class="ver">/ PHOTO</span></a></div>
    <div class="nav"><a href="/contact/">CONTACT</a></div>
  </div>

  <div class="cat-head"><h1 id="catTitle">PHOTO</h1></div>

  <div class="scene"><div class="carousel" id="carousel"></div></div>

  <button class="arrow-btn left" id="prev" aria-label="prev"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
  <button class="arrow-btn right" id="next" aria-label="next"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>

  <div class="counter"><b id="curIdx">01</b> / <span id="total">07</span></div>
  <div class="hint">DRAG OR USE ARROWS</div>

  <!-- detail overlay -->
  <div class="overlay" id="overlay">
    <button class="ov-close" id="ovClose"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="ov-wrap" id="ovWrap"></div>
  </div>

<script>
/* ===== sample data (replaced by works.json on real site) ===== */
const SAMPLE_VIDEO=[
 {id:"work-001",title:"Tonliz - 마지막으로 (feat.박현진) [Performance Video]",type:"Full Video",year:"2026",client:"SA Visual",videoId:"6sOTSN92FrU",credits:["Artist: Tonliz","Director: SA Visual","Edit: SA Visual","Executive: SA Visual"]},
 {id:"work-002",title:"SEIJI JUNE - SAINT DEVIL [Teaser Video]",type:"Teaser",year:"2026",client:"SA Visual",videoId:"8bVPOcHUN6k",credits:["Artist: SEIJI JUNE","Director: SA Visual","Edit: SA Visual","Executive: SA Visual"]},
 {id:"work-003",title:"Youngcode - WAKE UP! (INTERLUDE) [Visual Art Film]",type:"Full Video",year:"2025",client:"SA Visual",videoId:"D76l-7FI1k4",credits:["Artist: Youngcode","Director: SA Visual","Edit: SA Visual","Executive: SA Visual"]},
 {id:"work-004",title:"하이(Hi) - 일기장 (Acoustic ver.) [Live Clip]",type:"Full Video",year:"2025",client:"SA Visual",videoId:"d4fQGoyGt68",credits:["Artist: 하이(Hi)","Director: SA Visual","Edit: SA Visual","Executive: SA Visual"]},
 {id:"work-005",title:"INCENSE - INCENSE [Visualizer]",type:"Full Video",year:"2026",client:"SA Visual",videoId:"FbxYKzJyp-s",credits:["Artist: INCENSE","Director: SA Visual","Edit: SA Visual","Executive: SA Visual"]},
 {id:"work-006",title:"NNING - YOU VS ME [Live Clip]",type:"Full Video",year:"2026",client:"SA Visual",videoId:"ZVTdR3FShIU",credits:["Artist: NNING","Director: RASCAF","Edit: RASCAF","Executive: SA Visual"]},
 {id:"work-007",title:"SEIJI JUNE - LOVE IN THE BACKSEAT (Feat.Youngcode) [Performance Video]",type:"Teaser",year:"2026",client:"SA Visual",videoId:"OD7nBnY22cQ",credits:["Artist: SEIJI JUNE","Director: SA Visual","Film: SA Visual","Edit: SA Visual","Executive: SA Visual"]}
];

/* cursor */
const cd=document.querySelector('.cur-dot'),cr=document.querySelector('.cur-ring');
let mxx=innerWidth/2,myy=innerHeight/2,rxx=mxx,ryy=myy;
addEventListener('mousemove',e=>{mxx=e.clientX;myy=e.clientY;cd.style.left=mxx+'px';cd.style.top=myy+'px';});
(function r(){rxx+=(mxx-rxx)*.30;ryy+=(myy-ryy)*.30;cr.style.left=rxx+'px';cr.style.top=ryy+'px';requestAnimationFrame(r);})();
function bindHover(el){el.addEventListener('mouseenter',()=>cr.classList.add('hov'));el.addEventListener('mouseleave',()=>cr.classList.remove('hov'));}
document.querySelectorAll('a,button').forEach(bindHover);

/* category detection */
function detectCategory(){
  const p=location.pathname;
  if(p.includes('/shorts'))return 'Shorts';
  if(p.includes('/photo'))return 'Photo';
  if(p.includes('/design'))return 'Design';
  return 'Video';
}

/* load works */
let WORKS=[];
async function load(){
  const cat=detectCategory();
  document.getElementById('catTitle').textContent=cat.toUpperCase();
  document.querySelector('.brand .ver').textContent='/ '+cat.toUpperCase();
  try{
    const res=await fetch('/data/works.json');
    const all=await res.json();
    WORKS=all.filter(w=> cat==='Video' ? (w.type==='Full Video'||w.type==='Teaser') : w.type===cat);
    WORKS.reverse(); // latest first
  }catch(e){
    WORKS=SAMPLE_VIDEO; // demo fallback
  }
  build();
}

/* build carousel */
const carousel=document.getElementById('carousel');
let N=0,step=0,radius=520;
function thumbOf(w){ return w.videoId ? 'https://img.youtube.com/vi/'+w.videoId+'/maxresdefault.jpg' : w.thumb; }
function build(){
  carousel.innerHTML='';
  N=WORKS.length;
  document.getElementById('total').textContent=String(N).padStart(2,'0');
  step=360/N;
  radius=Math.min(760, Math.max(320, (98)/Math.tan(Math.PI/N) + 120)); // keep cards apart
  WORKS.forEach((w,i)=>{
    const it=document.createElement('div');
    it.className='item';
    it.dataset.i=i;
    it.innerHTML='<div class="item-inner"><img src="'+thumbOf(w)+'" alt="" loading="lazy"/>'+
      '<div class="ov"><div class="t">'+w.title.replace(/\[.*?\]/g,'').trim()+'</div><div class="y">'+w.type+' · '+w.year+'</div></div></div>';
    it.addEventListener('click',()=>{ if(Math.abs(angleOf(i))<26) openWork(w); else snapTo(i); });
    bindHover(it);
    carousel.appendChild(it);
  });
}

/* rotation state */
let cur=0,target=0;
const auto=-0.04; // slow auto spin (deg per frame)
function angleOf(i){ // normalized angle of item i relative to front
  let a=(cur + i*step)%360; if(a>180)a-=360; if(a<-180)a+=360; return a;
}
function snapTo(i){ target = -i*step; }
function frame(){
  target += auto;
  cur += (target-cur)*0.08;
  const items=carousel.children;
  let frontI=0,frontMin=999;
  for(let i=0;i<items.length;i++){
    const a=cur + i*step;
    items[i].style.transform='rotateY('+a+'deg) translateZ('+radius+'px)';
    let na=a%360; if(na>180)na-=360; if(na<-180)na+=360;
    const fade=(Math.cos(na*Math.PI/180)+1)/2;   // 0(back)..1(front), wider visibility
    const op=Math.pow(fade,1.3);
    items[i].style.opacity=op.toFixed(3);
    items[i].style.pointerEvents = Math.abs(na)<70 ? 'auto':'none';
    items[i].style.zIndex=Math.round(op*100);
    if(Math.abs(na)<frontMin){frontMin=Math.abs(na);frontI=i;}
  }
  document.getElementById('curIdx').textContent=String(frontI+1).padStart(2,'0');
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* arrows */
document.getElementById('next').addEventListener('click',()=>{target-=step;});
document.getElementById('prev').addEventListener('click',()=>{target+=step;});
addEventListener('keydown',e=>{if(e.key==='ArrowRight')target-=step;if(e.key==='ArrowLeft')target+=step;if(e.key==='Escape')closeWork();});

/* drag */
let dragging=false,lastX=0;
addEventListener('mousedown',e=>{dragging=true;lastX=e.clientX;});
addEventListener('mouseup',()=>dragging=false);
addEventListener('mousemove',e=>{if(dragging){target+=(e.clientX-lastX)*0.25;lastX=e.clientX;}});

/* detail overlay */
const overlay=document.getElementById('overlay'),ovWrap=document.getElementById('ovWrap');
function mediaHTML(w){
  if(w.videoId) return '<div class="ov-media"><div class="ov-video"><iframe src="https://www.youtube.com/embed/'+w.videoId+'" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen></iframe></div></div>';
  if(w.images) return '<div class="ov-media" style="background:transparent"><div class="ov-gallery">'+w.images.map(im=>'<img src="'+im+'"/>').join('')+'</div></div>';
  if(w.thumb) return '<div class="ov-media"><img src="'+w.thumb+'" style="width:100%"/></div>';
  return '';
}
function openWork(w){
  ovWrap.innerHTML=
    '<div class="ov-head"><h2>'+w.title+'</h2><div class="ov-meta"><span>'+w.type+'</span><span>'+w.year+'</span><span>'+(w.client||'SA Visual')+'</span></div></div>'+
    mediaHTML(w)+
    '<div class="ov-credits"><h3>Credits</h3><div class="credits-grid">'+
      w.credits.map(c=>{const idx=c.indexOf(':');const role=idx>-1?c.slice(0,idx):'';const who=idx>-1?c.slice(idx+1).trim():c;
        return '<div class="credit"><span class="role">'+role+'</span><span class="who">'+who+'</span></div>';}).join('')+
    '</div></div>';
  overlay.classList.add('open');
  requestAnimationFrame(()=>overlay.classList.add('show'));
  document.querySelectorAll('.ov-close,.credit').forEach(bindHover);
}
function closeWork(){
  overlay.classList.remove('show');
  setTimeout(()=>{overlay.classList.remove('open');ovWrap.innerHTML='';},400);
}
document.getElementById('ovClose').addEventListener('click',closeWork);
overlay.addEventListener('click',e=>{if(e.target===overlay)closeWork();});

load();
</script>
</body>
</html>
