<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SA VISUAL — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
  :root{
    --bg:#070708;--fg:#f0f0f1;--silver:#c7c7d0;--dim:#5f5f66;--dimmer:#3a3a40;
    --line:rgba(240,240,241,0.12);--glass:rgba(22,22,26,0.55);
    --serif:'Bodoni Moda',serif;--mono:'JetBrains Mono',monospace;--body:'Pretendard',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--fg);font-family:var(--body);min-height:100vh;overflow:hidden;cursor:none;position:relative;}
  ::selection{background:var(--fg);color:var(--bg);}
  #wavebg{position:fixed;inset:0;z-index:0;pointer-events:none;}

  .cur-dot,.cur-ring{position:fixed;top:0;left:0;border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);}
  .cur-dot{width:4px;height:4px;background:var(--fg);}
  .cur-ring{width:34px;height:34px;border:1px solid rgba(240,240,241,0.35);transition:width .3s,height .3s,background .3s,border-color .3s;}
  .cur-ring.hov{width:64px;height:64px;background:rgba(240,240,241,0.06);border-color:transparent;}
  @media(hover:none){.cur-dot,.cur-ring{display:none;}body{cursor:auto;}}

  .topbar{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:30px 44px;font-family:var(--mono);font-size:12px;letter-spacing:1.5px;}
  .brand{display:flex;align-items:center;gap:11px;}
  .brand a{color:var(--fg);text-decoration:none;display:flex;align-items:center;gap:11px;}
  .brand .sq{width:9px;height:9px;background:var(--fg);}
  .brand .ver{color:var(--dim);}
  .nav{display:flex;gap:34px;}
  .nav a{color:var(--dim);text-decoration:none;transition:color .3s;}
  .nav a:hover{color:var(--fg);}
  .nav a.active{color:var(--fg);}
  .status{color:var(--dim);}

  /* page title watermark */
  .watermark{position:fixed;left:44px;top:50%;transform:translateY(-50%) rotate(180deg);writing-mode:vertical-rl;
    font-family:var(--mono);font-size:12px;letter-spacing:6px;color:var(--dimmer);z-index:5;text-transform:uppercase;}

  /* node graph */
  .stage{position:fixed;inset:0;z-index:10;}
  svg.links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:11;}
  .link{fill:none;stroke:rgba(240,240,241,0.22);stroke-width:1;stroke-dasharray:2 7;opacity:0;transition:opacity .8s ease,stroke .4s ease;}
  .link.show{opacity:1;}
  .link.hot{stroke:rgba(240,240,241,0.75);}

  /* center node */
  .core{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) scale(0);z-index:14;
    width:132px;height:132px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 40%,#1c1c20,#0c0c0e 70%);
    box-shadow:0 0 0 1px rgba(240,240,241,0.10),0 20px 60px rgba(0,0,0,0.6),inset 0 1px 1px rgba(255,255,255,0.06);
    transition:transform 1s cubic-bezier(.16,1,.3,1);}
  .core.in{transform:translate(-50%,-50%) scale(1);}
  .core::after{content:'';position:absolute;inset:-14px;border-radius:50%;border:1px solid rgba(240,240,241,0.06);animation:pulse 3s ease-in-out infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.12);opacity:0}}
  .core-text{font-family:var(--serif);font-weight:500;font-size:30px;letter-spacing:.5px;color:var(--fg);}

  /* category cards */
  .node{position:absolute;z-index:13;width:248px;opacity:0;transform:translateY(24px);
    transition:opacity .9s cubic-bezier(.16,1,.3,1),transform .9s cubic-bezier(.16,1,.3,1);}
  .node.in{opacity:1;transform:translateY(0);}
  .card{display:block;text-decoration:none;color:var(--fg);position:relative;
    background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(240,240,241,0.10);border-radius:16px;padding:22px 22px 20px;
    transition:transform .5s cubic-bezier(.16,1,.3,1),border-color .4s,background .4s;}
  .card:hover{transform:translateY(-8px);border-color:rgba(240,240,241,0.28);background:rgba(30,30,36,0.65);}
  .card-top{display:flex;justify-content:flex-end;align-items:center;margin-bottom:26px;}
  .idx{width:30px;height:30px;border-radius:50%;border:1px solid rgba(240,240,241,0.2);display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:11px;color:var(--silver);}
  .count{font-family:var(--mono);font-size:11px;letter-spacing:1px;color:var(--dim);}
  .card h3{font-family:var(--serif);font-weight:500;font-size:34px;line-height:1;letter-spacing:-0.01em;margin-bottom:6px;}
  .card .sub{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;color:var(--dim);text-transform:uppercase;}
  .arrow{position:absolute;right:20px;bottom:18px;width:34px;height:34px;border-radius:50%;
    background:rgba(240,240,241,0.08);display:flex;align-items:center;justify-content:center;
    transition:background .4s,transform .4s;}
  .card:hover .arrow{background:var(--fg);transform:translateX(4px);}
  .arrow svg{width:14px;height:14px;stroke:var(--fg);fill:none;stroke-width:1.6;transition:stroke .4s;}
  .card:hover .arrow svg{stroke:var(--bg);}

  .corner{position:fixed;z-index:50;font-family:var(--mono);font-size:11px;letter-spacing:1.5px;color:var(--dimmer);}
  .corner.br{bottom:30px;right:44px;}

  @media(max-width:920px){
    body{overflow-y:auto;}
    .topbar{padding:22px;}.nav{display:none;}.watermark{display:none;}.cur-dot,.cur-ring{display:none;}
    svg.links{display:none;}.core{position:relative;margin:120px auto 10px;left:auto;top:auto;transform:scale(1);}
    .core.in{transform:scale(1);}
    .stage{position:static;}
    .node{position:relative !important;left:auto !important;top:auto !important;width:88%;max-width:360px;margin:14px auto;opacity:1;transform:none;}
    .corner{display:none;}
  }
</style>
</head>

/* cursor */
const cd=document.querySelector('.cur-dot'),cr=document.querySelector('.cur-ring');
let mx=innerWidth/2,my=innerHeight/2,rx=mx,ry=my;
addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;cd.style.left=mx+'px';cd.style.top=my+'px';});
(function r(){rx+=(mx-rx)*.30;ry+=(my-ry)*.30;cr.style.left=rx+'px';cr.style.top=ry+'px';requestAnimationFrame(r);})();
document.querySelectorAll('a,.card').forEach(a=>{a.addEventListener('mouseenter',()=>cr.classList.add('hov'));a.addEventListener('mouseleave',()=>cr.classList.remove('hov'));});

/* wave dot background */
const wbg=document.getElementById('wavebg'),wx=wbg.getContext('2d');
let WW,WH,WDPR;
function wsize(){WDPR=Math.min(devicePixelRatio||1,2);WW=wbg.width=innerWidth*WDPR;WH=wbg.height=innerHeight*WDPR;wbg.style.width=innerWidth+'px';wbg.style.height=innerHeight+'px';}
wsize();addEventListener('resize',wsize);
let wt=0;
function wave(){
  wt+=0.015;
  wx.clearRect(0,0,WW,WH);
  const gap=26*WDPR,cx=WW/2,cy=WH/2,maxd=Math.hypot(cx,cy);
  for(let y=gap/2;y<WH;y+=gap){
    for(let x=gap/2;x<WW;x+=gap){
      const ph=Math.sin(x*0.010/WDPR+wt)+Math.cos(y*0.011/WDPR+wt*0.8);
      const b=0.5+0.5*Math.sin(ph*1.4);
      const dist=Math.hypot(x-cx,y-cy)/maxd;
      const edge=1-Math.min(1,dist*1.04);
      const alpha=(0.05+b*0.15)*edge;
      if(alpha<0.012)continue;
      const r=(0.5+b*1.4)*WDPR;
      wx.beginPath();wx.fillStyle='rgba(240,240,241,'+alpha.toFixed(3)+')';
      wx.arc(x,y,r,0,Math.PI*2);wx.fill();
    }
  }
  requestAnimationFrame(wave);
}
wave();

/* link drawing */
const svg=document.getElementById('links'),core=document.getElementById('core');
const nodes=[...document.querySelectorAll('.node')];
const paths={};
nodes.forEach(n=>{
  const p=document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('class','link');
  svg.appendChild(p);
  paths[n.dataset.cat]=p;
  // hover highlight
  n.addEventListener('mouseenter',()=>p.classList.add('hot'));
  n.addEventListener('mouseleave',()=>p.classList.remove('hot'));
});
let dash=0;
function center(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}
function draw(){
  const c=center(core);
  nodes.forEach(n=>{
    const card=n.querySelector('.card');
    const p=center(card);
    const dy=p.y-c.y;
    const d="M "+c.x+" "+c.y+" C "+c.x+" "+(c.y+dy*0.5)+" "+p.x+" "+(c.y+dy*0.5)+" "+p.x+" "+p.y;
    paths[n.dataset.cat].setAttribute('d',d);
  });
  dash-=0.25;
  svg.querySelectorAll('.link').forEach(l=>l.style.strokeDashoffset=dash);
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
addEventListener('resize',()=>{});

/* entrance sequence */
window.addEventListener('load',()=>{
  setTimeout(()=>core.classList.add('in'),200);
  const order=['n-video','n-shorts','n-photo','n-design'];
  order.forEach((id,i)=>{
    setTimeout(()=>{
      document.getElementById(id).classList.add('in');
      const cat=document.getElementById(id).dataset.cat;
      paths[cat].classList.add('show');
    },650+i*180);
  });
});
// fallback if load already fired
if(document.readyState==='complete'){
  setTimeout(()=>core.classList.add('in'),200);
  ['n-video','n-shorts','n-photo','n-design'].forEach((id,i)=>setTimeout(()=>{document.getElementById(id).classList.add('in');paths[document.getElementById(id).dataset.cat].classList.add('show');},650+i*180));
}


/* auto count from works.json */
(async function(){
  try{
    const res=await fetch('/data/works.json');
    const works=await res.json();
    const c={video:0,shorts:0,photo:0,design:0};
    works.forEach(w=>{
      if(w.type==='Full Video'||w.type==='Teaser')c.video++;
      else if(w.type==='Shorts')c.shorts++;
      else if(w.type==='Photo')c.photo++;
      else if(w.type==='Design')c.design++;
    });
    Object.keys(c).forEach(k=>{
      const el=document.querySelector('[data-count="'+k+'"]');
      if(el) el.textContent=String(c[k]).padStart(2,'0')+' WORKS';
    });
  }catch(e){/* keep fallback numbers */}
})();

/* timecode */
const tc=document.getElementById('tc'),t0=Date.now();
setInterval(()=>{const t=Date.now()-t0,s=Math.floor(t/1000),f=String(Math.floor((t%1000)/40)).padStart(2,'0');
  tc.textContent=`${String(Math.floor(s/3600)).padStart(2,'0')}:${String(Math.floor(s/60)%60).padStart(2,'0')}:${String(s%60).padStart(2,'0')}:${f}`;},40);
</script>
