<style>
  :root{
    --bg:#070708;--fg:#f0f0f1;--silver:#c7c7d0;--dim:#5f5f66;--dimmer:#3a3a40;
    --line:rgba(240,240,241,0.12);
    --serif:'Bodoni Moda',serif;--mono:'JetBrains Mono',monospace;--body:'Pretendard',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--fg);font-family:var(--body);min-height:100vh;overflow-x:hidden;cursor:none;position:relative;
    display:flex;align-items:center;justify-content:center;padding:100px 30px;}
  ::selection{background:var(--fg);color:var(--bg);}
  .grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:radial-gradient(rgba(240,240,241,0.05) 1px,transparent 1px);background-size:34px 34px;
    mask-image:radial-gradient(ellipse 70% 70% at 50% 50%,#000 30%,transparent 100%);
    -webkit-mask-image:radial-gradient(ellipse 70% 70% at 50% 50%,#000 30%,transparent 100%);}

  .cur-dot,.cur-ring{position:fixed;top:0;left:0;border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);}
  .cur-dot{width:4px;height:4px;background:var(--fg);}
  .cur-ring{width:34px;height:34px;border:1px solid rgba(240,240,241,0.35);transition:width .3s,height .3s,background .3s,border-color .3s;}
  .cur-ring.hov{width:58px;height:58px;background:rgba(240,240,241,0.06);border-color:transparent;}
  @media(hover:none){.cur-dot,.cur-ring{display:none;}body{cursor:auto;}}

  .topbar{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:30px 44px;font-family:var(--mono);font-size:12px;letter-spacing:1.5px;}
  .brand{display:flex;align-items:center;gap:11px;}
  .brand a{color:var(--fg);text-decoration:none;display:flex;align-items:center;gap:11px;}
  .brand .sq{width:9px;height:9px;background:var(--fg);}
  .brand .ver{color:var(--dim);}
  .nav a{color:var(--dim);text-decoration:none;transition:color .3s;}
  .nav a:hover,.nav a.active{color:var(--fg);}

  /* ticket */
  .ticket{position:relative;z-index:10;width:100%;max-width:920px;
    display:grid;grid-template-columns:360px 1fr;
    background:rgba(16,16,19,0.7);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border:1px solid rgba(240,240,241,0.1);border-radius:18px;overflow:hidden;
    box-shadow:0 40px 100px rgba(0,0,0,0.6);
    opacity:0;transform:translateY(20px);transition:opacity 1s cubic-bezier(.16,1,.3,1),transform 1s cubic-bezier(.16,1,.3,1);}
  .ticket.in{opacity:1;transform:none;}

  /* left: halftone logo */
  .ticket-left{position:relative;background:#0a0a0c;border-right:1px dashed rgba(240,240,241,0.16);aspect-ratio:1/1;}
  #logoImg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:76%;height:76%;object-fit:contain;}
  .left-tag{position:absolute;top:24px;left:24px;font-family:var(--mono);font-size:13px;line-height:1.5;letter-spacing:2px;
    color:rgba(240,240,241,0.5);text-transform:uppercase;pointer-events:none;}
  .left-foot{position:absolute;bottom:22px;left:24px;right:24px;font-family:var(--mono);font-size:10px;letter-spacing:1px;color:var(--dimmer);}

  /* right: info */
  .ticket-right{padding:38px 40px;display:flex;flex-direction:column;}
  .row{display:flex;align-items:center;gap:14px;padding:11px 0;font-family:var(--mono);font-size:13px;letter-spacing:.5px;}
  .row .k{width:104px;color:var(--dim);text-transform:uppercase;flex-shrink:0;}
  .row .gt{color:var(--dimmer);}
  .row .v{color:var(--fg);display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .row .v a{color:var(--fg);text-decoration:none;border-bottom:1px solid transparent;transition:border-color .3s;}
  .row .v a:hover{border-color:var(--fg);}
  .copy-btn{font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--silver);
    background:rgba(240,240,241,0.08);border:1px solid var(--line);border-radius:4px;padding:4px 10px;cursor:none;transition:all .3s;}
  .copy-btn:hover{background:var(--fg);color:var(--bg);border-color:var(--fg);}
  .copy-btn.done{background:var(--fg);color:var(--bg);border-color:var(--fg);}

  .divider{margin:18px 0;font-family:var(--mono);font-size:13px;color:var(--dimmer);letter-spacing:0;overflow:hidden;white-space:nowrap;user-select:none;}

  .ticket-foot{margin-top:auto;padding-top:26px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;}
  .ticket-foot .big{font-family:var(--serif);font-weight:500;font-size:22px;letter-spacing:.5px;}
  .ticket-foot .sub{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;color:var(--dim);text-transform:uppercase;margin-top:6px;}
  .ticket-foot .valid{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;color:var(--dimmer);text-transform:uppercase;text-align:right;}

  .corner{position:fixed;z-index:50;font-family:var(--mono);font-size:11px;letter-spacing:1.5px;color:var(--dimmer);}
  .corner.br{bottom:30px;right:44px;}

  @media(max-width:820px){
    .topbar{padding:22px;}.cur-dot,.cur-ring{display:none;}
    .ticket{grid-template-columns:1fr;max-width:420px;}
    .ticket-left{border-right:none;border-bottom:1px dashed rgba(240,240,241,0.16);}
    .ticket-right{padding:30px 26px;}
    .row{font-size:12px;}.row .k{width:88px;}
    .corner{display:none;}
  }
</style>
</head>

/* cursor */
const cd=document.querySelector('.cur-dot'),cr=document.querySelector('.cur-ring');
let mx=innerWidth/2,my=innerHeight/2,rx=mx,ry=my;
addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;cd.style.left=mx+'px';cd.style.top=my+'px';});
(function r(){rx+=(mx-rx)*.30;ry+=(my-ry)*.30;cr.style.left=rx+'px';cr.style.top=ry+'px';requestAnimationFrame(r);})();
document.querySelectorAll('a,button').forEach(a=>{a.addEventListener('mouseenter',()=>cr.classList.add('hov'));a.addEventListener('mouseleave',()=>cr.classList.remove('hov'));});

/* logo image */
document.getElementById('logoImg').src=LOGO_B64;

/* divider fill */
function fillDivider(){
  const el=document.getElementById('divider');
  el.textContent='L'.repeat(120);
}
fillDivider();
addEventListener('resize',fillDivider);

/* copy email */
const copyBtn=document.getElementById('copyBtn');
copyBtn.addEventListener('click',function(){
  navigator.clipboard.writeText('safilm8206@gmail.com').then(()=>{
    copyBtn.textContent='Copied';copyBtn.classList.add('done');
    setTimeout(()=>{copyBtn.textContent='Copy';copyBtn.classList.remove('done');},1800);
  }).catch(()=>{});
});

/* entrance */
window.addEventListener('load',()=>setTimeout(()=>document.getElementById('ticket').classList.add('in'),150));
if(document.readyState==='complete')setTimeout(()=>document.getElementById('ticket').classList.add('in'),150);

/* timecode */
const tc=document.getElementById('tc'),t0=Date.now();
setInterval(()=>{const t=Date.now()-t0,s=Math.floor(t/1000),f=String(Math.floor((t%1000)/40)).padStart(2,'0');
  tc.textContent=`${String(Math.floor(s/3600)).padStart(2,'0')}:${String(Math.floor(s/60)%60).padStart(2,'0')}:${String(s%60).padStart(2,'0')}:${f}`;},40);
</script>
